<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F4FF"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="220" width="400" height="80" fill="#c8c8c8"/>
  <rect y="220" width="400" height="10" fill="#b0b0b0"/>
  <!-- Canopy -->
  <rect x="40" y="60" width="320" height="15" rx="3" fill="url(#canopy)" stroke="#999" stroke-width="1"/>
  <!-- Canopy supports -->
  <rect x="60" y="75" width="6" height="145" fill="#bbb"/>
  <rect x="334" y="75" width="6" height="145" fill="#bbb"/>
  <!-- Charger 1 -->
  <rect x="100" y="120" width="50" height="100" rx="5" fill="#2a9d8f"/>
  <rect x="108" y="130" width="34" height="20" rx="2" fill="#1a7a6f"/>
  <rect x="115" y="135" width="20" height="10" rx="1" fill="#40e0d0"/>
  <rect x="110" y="160" width="30" height="4" rx="2" fill="white"/>
  <rect x="110" y="170" width="30" height="4" rx="2" fill="white"/>
  <circle cx="125" cy="200" r="8" fill="#1a7a6f"/>
  <!-- Charger 2 -->
  <rect x="180" y="120" width="50" height="100" rx="5" fill="#2a9d8f"/>
  <rect x="188" y="130" width="34" height="20" rx="2" fill="#1a7a6f"/>
  <rect x="195" y="135" width="20" height="10" rx="1" fill="#40e0d0"/>
  <rect x="190" y="160" width="30" height="4" rx="2" fill="white"/>
  <rect x="190" y="170" width="30" height="4" rx="2" fill="white"/>
  <circle cx="205" cy="200" r="8" fill="#1a7a6f"/>
  <!-- Charger 3 -->
  <rect x="260" y="120" width="50" height="100" rx="5" fill="#2a9d8f"/>
  <rect x="268" y="130" width="34" height="20" rx="2" fill="#1a7a6f"/>
  <rect x="275" y="135" width="20" height="10" rx="1" fill="#40e0d0"/>
  <rect x="270" y="160" width="30" height="4" rx="2" fill="white"/>
  <rect x="270" y="170" width="30" height="4" rx="2" fill="white"/>
  <circle cx="285" cy="200" r="8" fill="#1a7a6f"/>
  <!-- EV label on chargers -->
  <text x="125" y="148" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">EV</text>
  <text x="205" y="148" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">EV</text>
  <text x="285" y="148" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">EV</text>
</svg>
